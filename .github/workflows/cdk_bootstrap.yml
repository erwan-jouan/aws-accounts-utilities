name: Bootstrap AWS Accounts

# Prerequisite: run `make deploy-oidc` locally before triggering this workflow.
# That deploys the GitHub OIDC provider + IAM role to both accounts so the
# jobs below can authenticate without stored credentials.
on:
  workflow_dispatch:

env:
  NODE_VERSION: ${{ vars.NODE_VERSION }}
  AUTHORIZED_ACTOR: ${{ secrets.GH_AUTHORIZED_ACTOR }}

jobs:

  bootstrap-management:
    environment: production
    name: CDK bootstrap – management
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cdk
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check authorized actor
        if: github.actor != env.AUTHORIZED_ACTOR
        run: |
          echo "❌ '${{ github.actor }}' is not authorized to run this workflow."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: cdk/package-lock.json
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_CICD_ACCOUNT_ID }}:role/${{ secrets.GH_ACTIONS_ROLE_NAME }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: CDK bootstrap
        run: |
          npx cdk bootstrap aws://${{ secrets.AWS_CICD_ACCOUNT_ID }}/${{ secrets.AWS_REGION }}
      - name: Deploy cdk stack
        env:
          CICD_ACCOUNT_ID: ${{ secrets.AWS_CICD_ACCOUNT_ID }}
          GH_ORG: ${{ secrets.GH_ORG }}
          GH_TOKEN_SECRET_NAME: ${{ secrets.GH_TOKEN_SECRET_NAME }}
        run: npx cdk deploy --all --require-approval never --app "npx ts-node --prefer-ts-exts bin/cicd-account.ts"

  bootstrap-production:
    environment: production
    name: CDK bootstrap – production
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cdk
    # Management must be bootstrapped first so the --trust ARN is valid
    needs: bootstrap-management
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check authorized actor
        if: github.actor != env.AUTHORIZED_ACTOR
        run: |
          echo "❌ '${{ github.actor }}' is not authorized to run this workflow."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: cdk/package-lock.json
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_PROD_ACCOUNT_ID }}:role/${{ secrets.GH_ACTIONS_ROLE_NAME }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: CDK bootstrap (trust management account)
        run: |
          npx cdk bootstrap aws://${{ secrets.AWS_PROD_ACCOUNT_ID }}/${{ secrets.AWS_REGION }} \
            --trust ${{ secrets.AWS_CICD_ACCOUNT_ID }} \
            --cloudformation-execution-policies arn:aws:iam::aws:policy/AdministratorAccess
      - name: Deploy cdk stack
        env:
          PROD_ACCOUNT_ID: ${{ secrets.AWS_PROD_ACCOUNT_ID }}
        run: npx cdk deploy --all --require-approval never --app "npx ts-node --prefer-ts-exts bin/prod-account.ts"